<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mapa de departamentos en venta de dueños directos en CABA. Contacto directo por WhatsApp.">
<title>Ladrillo Hub — Deptos en venta, dueños directos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--f:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--bg:#fff;--card:#fff;--ink:#222;--mut:#6a6a6a;--line:#ddd;--line2:#8a8a8a;--soft:#f7f7f7;--gray:#f2f2f2;--grad:linear-gradient(to right,#e61e4d 0%,#e31c5f 50%,#d70466 100%);--sh:0 0 0 1px rgba(0,0,0,.04),0 2px 6px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.14);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:12px clamp(12px,3vw,32px);background:var(--card);border-bottom:1px solid var(--line);z-index:1000;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;color:#e31c5f;font:800 20px/1 var(--f);letter-spacing:-.02em;white-space:nowrap;text-decoration:none}
.logo svg{width:32px;height:32px}.logo span{color:var(--ink)}.logo b{color:#e31c5f}
.flt{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;height:46px;padding:0 6px 0 16px;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:13px;font-weight:600}
.flt input{width:86px;height:34px;border:0;background:var(--gray);border-radius:999px;padding:0 12px;font-weight:500}
.pill{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:transparent;font:600 14px var(--f);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.pill:hover{border-color:var(--ink);background:var(--soft)}
.pill svg{width:18px;height:18px}.pill .ua{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--gray)}.pill .mut{font-size:13px;font-weight:500;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 26px;border:0;border-radius:999px;background:var(--grad);color:#fff;font:600 16px var(--f);cursor:pointer;text-decoration:none}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5}
.btn.sm{height:42px;padding:0 20px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}.btn.ghost:hover{background:var(--gray)}
.btn.wa{background:#1fa855}.btn.red{background:transparent;color:#c13515;border:1px solid #c13515}
.btn.blk{width:100%}
#map{flex:1;z-index:1;background:var(--gray)}
.pinw{background:none;border:0}
.pin{position:absolute;transform:translate(-50%,calc(-100% - 6px));white-space:nowrap;background:var(--card);border-radius:999px;padding:7px 12px;font:700 14px var(--f);box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;line-height:1.1}
.pin small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
.pin:hover{background:var(--ink);color:#fff}.pin:hover small{color:#ddd}
.pin.d{background:var(--grad);color:#fff}
.leaflet-popup-content-wrapper{border-radius:24px;box-shadow:var(--sh);padding:0}
.leaflet-popup-content{margin:22px;width:min(300px,72vw)!important;font-family:var(--f)}
.price{font:800 30px/1.1 var(--f);letter-spacing:-.03em;text-decoration:underline;text-underline-offset:4px}
.price small{font:400 16px var(--f);color:var(--mut);text-decoration:none;margin-left:6px;letter-spacing:0}
.box{background:var(--gray);border-radius:14px;padding:12px 14px;font-size:14px;margin:14px 0}
.desc{white-space:pre-wrap;word-break:break-word;margin:12px 0 0;font-size:15px}
.stack{display:grid;gap:10px}
.sheet{position:fixed;z-index:1100;left:0;right:0;bottom:0;max-height:78%;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:22px;box-shadow:var(--sh);padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
@media(min-width:760px){.sheet{left:20px;top:88px;bottom:20px;right:auto;width:400px;max-height:none;border-radius:24px}}
.sheet h2{margin:0 0 4px;font:700 24px var(--f);letter-spacing:-.02em}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.grp{border:1px solid var(--line2);border-radius:16px;overflow:hidden;margin-bottom:12px}
.grp label{display:block;padding:10px 16px 8px;border-top:1px solid var(--line2)}.grp label:first-child{border-top:0}
.grp span{display:block;font:700 11px var(--f);letter-spacing:.04em;text-transform:uppercase}
.grp input,.grp textarea{width:100%;border:0;padding:2px 0 0;background:transparent;font-size:16px;outline:0}
.grp textarea{min-height:84px;resize:none}
.cnt{text-align:right;font-size:12px;color:var(--mut);margin:-6px 4px 10px}
.x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--gray);font-size:20px;cursor:pointer}
.msg{font-size:14px;color:var(--mut);margin:10px 0}.err{color:#c13515;font-weight:600}
.row{display:flex;gap:8px;margin-bottom:10px}.row>*{flex:1}
</style>
</head>
<body>
<header>
 <a class="logo" href="./" aria-label="Ladrillo Hub"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3" y="7" width="26" height="18" rx="2"/><path d="M3 13h26M3 19h26M11 7v6M21 7v6M16 13v6M8 19v6M24 19v6"/></svg><span>Ladrillo<b>Hub</b></span></a>
 <div class="flt">Precio USD <input id="pmin" type="number" min="0" inputmode="numeric" placeholder="Mín"><input id="pmax" type="number" min="0" inputmode="numeric" placeholder="Máx"></div>
 <button class="pill" id="login"></button>
 <button class="btn sm" id="add">Vendo mi depto</button>
</header>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><!-- window.CFG = {url:"https://xxxx.supabase.co", key:"anon key"} -->
<script>
const REPORTS_TO_BLOCK=3; // debe coincidir con la vista pins_public de supabase.sql
const CFG=window.CFG||{};
const $=s=>document.querySelector(s);
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const fmt=n=>"USD "+Number(n).toLocaleString("es-AR");
if(!CFG.url||!CFG.key||String(CFG.url).startsWith("PEGAR")){document.body.append(Object.assign(mk("div","msg err","Falta configurar Supabase en config.js."),{style:"padding:20px"}));throw new Error("config")}
const sb=supabase.createClient(CFG.url,CFG.key);
let user=null,pins=[],pmin=0,pmax=Infinity,draft=null,placing=false,panel=null,dm=null;

const map=L.map("map",{zoomControl:false}).setView([-34.6037,-58.42],12);
L.control.zoom({position:"bottomright"}).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const layer=L.layerGroup().addTo(map);
function icon(cls,a,b){const w=mk("div","pin"+(cls?" "+cls:""));w.append(mk("span",0,a));if(b)w.append(mk("small",0,b));return L.divIcon({className:"pinw",html:w,iconSize:[0,0]})}
function draw(){layer.clearLayers();
 pins.filter(p=>p.price>=pmin&&p.price<=pmax).forEach(p=>L.marker([p.lat,p.lon],{icon:icon("","Depto · "+fmt(p.price),p.name)}).addTo(layer).bindPopup(()=>popup(p),{autoPanPadding:[30,80]}))}
async function load(){const {data,error}=await sb.from("pins_public").select("id,name,phone,price,descr,lat,lon");if(!error){pins=data||[];draw()}}
const waNum=v=>{let d=String(v).replace(/\D/g,"").replace(/^0+/,"");if(d.length===10)d="549"+d;else if(/^54\d{10}$/.test(d))d="549"+d.slice(2);return d};

function popup(p){
 const d=mk("div"),pr=mk("div","price",fmt(p.price));pr.append(mk("small",0,"· depto en venta"));
 const b=mk("div","box");b.append(mk("b",0,p.name),document.createTextNode(" · dueño directo"));
 const a=mk("a","btn blk","Escribir por WhatsApp");a.href="https://wa.me/"+p.phone+"?text="+encodeURIComponent("Hola "+p.name+", vi tu depto de "+fmt(p.price)+" en Ladrillo Hub. ¿Sigue disponible?");a.target="_blank";a.rel="noopener";
 const r=mk("button","btn red blk sm","Denunciar: es una inmobiliaria"),fb=mk("div","msg");
 r.onclick=async()=>{if(!user){login();return}r.disabled=true;
  const {error}=await sb.from("pin_reports").insert({pin_id:p.id});
  fb.textContent=!error?"Gracias. Con "+REPORTS_TO_BLOCK+" denuncias el aviso se bloquea.":error.code==="23505"?"Ya denunciaste este aviso.":"No se pudo enviar la denuncia.";
  if(!error)load()};
 const s=mk("div","stack");s.append(a,r);d.append(pr,mk("div","desc",p.descr),b,s,fb);return d}

const pf=()=>{pmin=Number($("#pmin").value)||0;pmax=Number($("#pmax").value)||Infinity;draw()};
$("#pmin").oninput=pf;$("#pmax").oninput=pf;

// ===== login con Google (Supabase Auth) =====
const G='<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';
const login=()=>sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});
function paint(){const b=$("#login");b.textContent="";
 if(user){const m=user.user_metadata||{},nm=m.full_name||m.name||user.email||"Mi cuenta",pic=m.avatar_url||m.picture;
  if(pic){const i=new Image();i.className="ua";i.src=pic;i.alt="";i.referrerPolicy="no-referrer";b.append(i)}
  b.append(mk("span",0,String(nm).split(" ")[0]),mk("span","mut","Salir"));b.setAttribute("aria-label","Cerrar sesión")}
 else{b.insertAdjacentHTML("beforeend",G);b.append(mk("span",0,"Ingresar con Google"));b.setAttribute("aria-label","Ingresar con Google")}}
$("#login").onclick=()=>user?sb.auth.signOut():login();
sb.auth.getSession().then(({data})=>{user=data.session?data.session.user:null;paint()});
sb.auth.onAuthStateChange((_e,s)=>{user=s?s.user:null;paint()});

// ===== publicar =====
function closePanel(){if(panel){panel.remove();panel=null}placing=false;if(dm){map.removeLayer(dm);dm=null}draft=null}
function setDraft(la,lo,z){draft={lat:la,lon:lo};if(dm)dm.setLatLng([la,lo]);else{dm=L.marker([la,lo],{icon:icon("d","Tu depto"),draggable:true}).addTo(map);dm.on("dragend",()=>{const p=dm.getLatLng();draft={lat:p.lat,lon:p.lng}})}
 map.setView([la,lo],z||Math.max(map.getZoom(),16))}
map.on("click",e=>{if(placing)setDraft(e.latlng.lat,e.latlng.lng)});

$("#add").onclick=()=>{if(!user){login();return}closePanel();placing=true;
 const s=panel=mk("div","sheet"),x=mk("button","x","×");x.setAttribute("aria-label","Cerrar");x.onclick=closePanel;
 const grp=mk("div","grp"),fld=(t,e)=>{const l=mk("label");l.append(mk("span",0,t),e);grp.append(l);return e};
 const nm=fld("Tu nombre",mk("input"));nm.maxLength=40;nm.value=String((user.user_metadata||{}).full_name||"").split(" ")[0];
 const ph=fld("Celular con WhatsApp",mk("input"));ph.type="tel";ph.placeholder="11 5555 5555";
 const pr=fld("Precio que pedís (USD)",mk("input"));pr.type="number";pr.min=1;pr.inputMode="numeric";
 const ta=fld("Características y precio (máx. 200)",mk("textarea"));ta.maxLength=200;ta.placeholder="3 amb, 65 m², balcón, cochera. Acepto permuta.";
 const ct=mk("div","cnt","0/200");ta.oninput=()=>ct.textContent=ta.value.length+"/200";
 const gps=mk("button","btn ghost sm","Usar mi GPS"),ad=mk("input");ad.style.cssText="width:100%;padding:12px 16px;border:1px solid var(--line2);border-radius:16px;margin-bottom:10px";ad.placeholder="O escribí la dirección (calle y altura)";
 const bs=mk("button","btn ghost sm","Buscar dirección"),row=mk("div","row");row.append(gps,bs);
 const ms=mk("div","msg","Ubicá el pin con el GPS, la dirección o tocando el mapa. Podés arrastrarlo para ajustarlo."),ok=mk("button","btn blk","Publicar");
 s.append(x,mk("h2",0,"Vendo mi depto"),mk("p","sub","Solo dueños directos. Las inmobiliarias se denuncian y se bloquean."),grp,ct,ad,row,ms,ok);document.body.append(s);
 gps.onclick=()=>{ms.className="msg";ms.textContent="Buscando tu ubicación…";navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{setDraft(p.coords.latitude,p.coords.longitude,17);ms.textContent="Pin colocado. Podés arrastrarlo."},()=>{ms.className="msg err";ms.textContent="No pudimos leer el GPS. Tocá el mapa."},{enableHighAccuracy:true,timeout:10000}):(ms.className="msg err",ms.textContent="Tu navegador no permite GPS.")};
 bs.onclick=async()=>{const q=ad.value.trim();if(!q)return;ms.className="msg";ms.textContent="Buscando…";
  try{const j=await(await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ar&q="+encodeURIComponent(q+", Buenos Aires"))).json();if(!j[0])throw 0;setDraft(+j[0].lat,+j[0].lon,17);ms.textContent="Pin colocado. Podés arrastrarlo."}catch(e){ms.className="msg err";ms.textContent="No encontramos esa dirección. Probá con el GPS o tocá el mapa."}};
 ok.onclick=async()=>{const price=Math.round(Number(pr.value)),d=ta.value.trim(),n=nm.value.trim(),w=waNum(ph.value);
  const bad=!n?"Poné tu nombre.":w.length<12?"Revisá el celular (código de área + número).":!(price>0)?"Poné el precio.":d.length<10?"Contá las características del depto.":!draft?"Ubicá el pin en el mapa.":"";
  if(bad){ms.className="msg err";ms.textContent=bad;return}
  ok.disabled=true;
  const {error}=await sb.from("pins").insert({name:n,phone:w,price,descr:d,lat:draft.lat,lon:draft.lon});
  if(error){ok.disabled=false;ms.className="msg err";ms.textContent="No se pudo publicar. Probá de nuevo.";return}
  closePanel();load()};
};
load();setInterval(()=>{if(!document.hidden)load()},60000);
</script>
</body>
</html>
